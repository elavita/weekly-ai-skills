name: Weekly AI Skill Report

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-skill-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate weekly report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        run: python -m src.main --config config.json

      - name: Detect report period
        id: period
        shell: bash
        run: |
          PERIOD=$(python -c "from datetime import datetime; print(datetime.now().astimezone().isocalendar().year, end=''); print('-W', end=''); print(f'{datetime.now().astimezone().isocalendar().week:02d}')")
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"

      - name: Commit generated files
        id: commit
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- reports state)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          git commit -m "chore(report): publish ${{ steps.period.outputs.period }} [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update period issue
        uses: actions/github-script@v7
        env:
          PERIOD: ${{ steps.period.outputs.period }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const period = process.env.PERIOD;
            const marker = `<!-- ai-skill-weekly:${period} -->`;
            const reportPath = `reports/${period}/report.md`;
            const { owner, repo } = context.repo;
            const report = fs.readFileSync(reportPath, 'utf8');
            const branch = context.ref.replace('refs/heads/', '');
            const assetBase = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/reports/${period}/`;
            const body = `${marker}\n\n${report.replace(/\]\(images\//g, `](${assetBase}images/`)}`;
            const title = `AI 技能周报 ${period}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
